[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-timing-network"
version = "2026.10.5"
description = "Point-in-time crypto futures timing research"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "matplotlib", "scikit-learn", "lightgbm", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
